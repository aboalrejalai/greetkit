schema_version: "1.0"
workflow:
  id: "greetkit"
  name: "Full SDD Cycle"
  version: "1.0.0"
  author: "GreetKit"
  description: "Runs specify → plan → tasks → implement with review gates"

requires:
  greetkit_version: ">=0.1.0"
  integrations:
    any: ["agy", "generic"]

inputs:
  spec:
    type: string
    required: true
    prompt: "Describe what you want to build"
  integration:
    type: string
    default: "agy"
    prompt: "Integration to use (e.g. agy, generic)"
  scope:
    type: string
    default: "full"
    enum: ["full", "backend-only", "frontend-only"]

steps:
  - id: specify
    command: greetkit.specify
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.spec }}"

  - id: review-spec
    type: gate
    message: "Review the generated spec before planning."
    options: [approve, reject]
    on_reject: abort

  - id: plan
    command: greetkit.plan
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.spec }}"

  - id: review-plan
    type: gate
    message: "Review the plan before generating tasks."
    options: [approve, reject]
    on_reject: abort

  - id: tasks
    command: greetkit.tasks
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.spec }}"

  - id: implement
    command: greetkit.implement
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.spec }}"
