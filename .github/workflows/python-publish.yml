name: GreetKit CI/CD

# on:
#   release:
#     types: [published]
#   push:
#     branches:
#       - main
#   pull_request:
#     branches:
#       - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .
        
    - name: Test CLI Execution
      run: |
        greetkit --help

